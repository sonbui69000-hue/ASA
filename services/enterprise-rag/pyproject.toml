[project]
name = "enterprise-rag"
version = "0.0.0"
description = "Isolated synthetic preparation for contract 2.2.0"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
# A06 review and an offline, hash-verified lock are required before provisioning.
# This version was observed in host package metadata; it is not approved here.
test = ["pytest==9.0.3"]

[tool.uv]
package = false
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"

